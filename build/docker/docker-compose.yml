services:

  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: tp-apvv-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-retinal_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tp-apvv-net

  # ─── Classifier service ───────────────────────────────────────────────────────
  classifier-service:
    image: ppetermm/image-preprocessing-ensemble-dr-classifier-service:latest
    container_name: tp-apvv-classifier-service
    restart: unless-stopped
    environment:
      AZURE_STORAGE_SAS_TOKEN: ${AZURE_STORAGE_SAS_TOKEN:-your-sas-token}
      PROCESSING_SERVICE_PORT: "${PROCESSING_SERVICE_PORT:-5000}"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: "${LOG_FORMAT:-%(asctime)s - %(name)s - %(levelname)s - %(message)s}"
      LOG_FILE: ${LOG_FILE:-logs/classifier.log}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${PROCESSING_SERVICE_PORT:-5000}:${PROCESSING_SERVICE_PORT:-5000}"
    volumes:
      - ./logs:/app/logs
    networks:
      - tp-apvv-net

  # ─── Fundus DR inference ("Detekcia": DR grade + MA/HE/SE/EX concept heatmaps) ─
  fundus-dr-inference:
    image: ${FUNDUS_IMAGE:-tanczi0810/fundus-dr-inference:1.0.0}
    platform: linux/amd64                    # only arch published; Apple Silicon runs it emulated
    container_name: tp-apvv-fundus-dr-inference
    restart: unless-stopped
    environment:
      AUTH_TOKEN: ${FUNDUS_AUTH_TOKEN:-}     # empty = no auth
      # Uses the redis of this stack (separate db index from the classifier)
      REDIS_URL: redis://redis:6379/${FUNDUS_REDIS_DB:-1}
      CACHE_TTL_S: ${FUNDUS_CACHE_TTL_S:-604800}
      MAX_UPLOAD_MB: ${FUNDUS_MAX_UPLOAD_MB:-20}
      CHECKPOINT_PATH: /models/${FUNDUS_CHECKPOINT_FILE:-earthy-sweep-1-epoch=16-val_loss=0.55.ckpt}
      ACTIVATION_CACHE_DIR: /activation_cache
    ports:
      - "${FUNDUS_BIND_ADDR:-127.0.0.1}:${FUNDUS_PORT:-8000}:8000"
    volumes:
      # Not in git: copy the model checkpoint / activation cache here (see env_example)
      - ${FUNDUS_CHECKPOINT_DIR:-./fundus-dr-inference/models}:/models:ro
      - ${FUNDUS_ACTIVATION_CACHE_DIR:-./fundus-dr-inference/activation_cache}:/activation_cache:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - tp-apvv-net

  # ─── Redis (for caching) ─────────────────────────────────────────────────────
  redis:
    image: redis:latest
    container_name: tp-apvv-redis
    ports:
      - "6379:6379"
    networks:
      - tp-apvv-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    # Shared with fundus-dr-inference (its cache entries carry a TTL, db 1). Memory is bounded and only
    # keys with a TTL are evicted, so classifier data in db 0 is never dropped to make room for them.
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-512mb} --maxmemory-policy volatile-lru
    volumes:
      - redis-data:/data

  # ─── pgAdmin (PostgreSQL web admin) ─────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: tp-apvv-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tp-apvv-net

  # ─── Flask application ────────────────────────────────────────────────────────
  flask-app:
    # image: ghcr.io/${IMAGE_OWNER:-local}/tp-apvv-flask:${IMAGE_TAG:-latest}
    build:
      context: ../../
      dockerfile: build/docker/Dockerfile
    container_name: tp-apvv-flask
    restart: unless-stopped
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      FLASK_PORT: "${FLASK_PORT:-8080}"
      # Point to the compose service name so inter-container routing works
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-retinal_db}
      PROCESSING_SERVICE_URL: http://classifier-service:${PROCESSING_SERVICE_PORT:-5000}
      PROCESSING_SERVICE_PORT: "${PROCESSING_SERVICE_PORT:-5000}"
      FUNDUS_INFERENCE_URL: http://fundus-dr-inference:8000
      FUNDUS_INFERENCE_AUTH_TOKEN: ${FUNDUS_AUTH_TOKEN:-}
      FUNDUS_INFERENCE_TIMEOUT_S: ${FUNDUS_INFERENCE_TIMEOUT_S:-300}
      FUNDUS_INFERENCE_N_STEPS: ${FUNDUS_INFERENCE_N_STEPS:-5}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: "${LOG_FORMAT:-%(asctime)s - %(name)s - %(levelname)s - %(message)s}"
      LOG_FILE: ${LOG_FILE:-logs/flask.log}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    ports:
      - "${FLASK_PORT:-8080}:${FLASK_PORT:-8080}"
    volumes:
      # Persist uploaded files outside the container
      - uploads:/app/server/uploads
      # Persist logs on the host so they survive container restarts and crashes
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      classifier-service:
        condition: service_started
      fundus-dr-inference:
        condition: service_started
    networks:
      - tp-apvv-net

# ─── Named volumes ────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  uploads:
  pgadmin_data:
  redis-data:

    # ─── Network ──────────────────────────────────────────────────────────────────
networks:
  tp-apvv-net:
    driver: bridge
